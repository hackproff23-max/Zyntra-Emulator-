name: Build Zyntra Emulator

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.1.6

      - name: Set up JDK 17
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # A pasta do TinySoundFont vem vazia (era um submodulo do git); baixa aqui.
      - name: Fetch TinySoundFont
        run: |
          D=app/src/main/cpp/mmapi_tsf/TinySoundFont
          if [ ! -f "$D/tsf.h" ]; then
            rm -rf "$D"
            git clone --depth 1 https://github.com/schellingb/TinySoundFont.git "$D"
          fi

      # Opcional: se voce criar os secrets SIGNING_KEY e KEYSTORE_PROPERTIES, usa sua chave fixa.
      - name: Decode keystore (optional secrets)
        env:
          ENCODED_KEYSTORE: ${{ secrets.SIGNING_KEY }}
          ENCODED_PROPS: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          if [ -n "$ENCODED_PROPS" ]; then
            echo "$ENCODED_KEYSTORE" | base64 -di > keystore.jks
            echo "$ENCODED_PROPS" | base64 -di > keystore.properties
          fi

      # Sem secrets, cria uma chave nova a cada build (o APK sai assinado e instalavel).
      - name: Generate temporary keystore
        run: |
          if [ ! -f keystore.properties ]; then
            keytool -genkeypair -keystore keystore.jks -alias zyntra -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass zyntra123 -keypass zyntra123 -dname "CN=Zyntra Emulator"
            printf 'keyAlias=zyntra\nkeyPassword=zyntra123\nstoreFile=keystore.jks\nstorePassword=zyntra123\n' > keystore.properties
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleEmulatorRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4.3.3
        with:
          name: Zyntra-Emulator
          path: app/build/outputs/apk/emulator/release/*armeabi-v7a*.apk
